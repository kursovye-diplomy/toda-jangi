<html lang="uz">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>To'da Jangi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one full-height play field (max 520px wide), HUD floats on top, menus as centered overlay cards */
:root{
  --sky:#8fd3f4; --sky2:#d6f1ff;
  --blue:#2369e8; --blue-dk:#1446a8;
  --red:#ea4b4f; --gold:#ffb400;
  --ink:#1b2738; --panel:#ffffff; --muted:#5b6b80; --soft:#eef4fb;
  --display:'Lilita One','Arial Black',Impact,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--body);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#app{position:relative;height:100%;max-width:520px;margin:0 auto;background:linear-gradient(var(--sky),var(--sky2))}
#cv{display:block;width:100%;height:100%}
.hud{position:absolute;top:10px;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:center;gap:6px;pointer-events:none}
.chip{background:rgba(255,255,255,.9);border-radius:999px;padding:6px 11px;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;box-shadow:0 2px 0 rgba(27,39,56,.15);white-space:nowrap}
.chip b{font-family:var(--display);font-weight:400;font-size:16px;letter-spacing:.02em}
#btnSound{pointer-events:auto;border:0;cursor:pointer;font-size:15px;padding:6px 10px;color:var(--ink);background:rgba(255,255,255,.9);box-shadow:0 2px 0 rgba(27,39,56,.15);border-radius:999px;font-family:var(--body)}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:rgba(27,39,56,.38);overflow-y:auto}
.card{background:var(--panel);border-radius:22px;padding:20px 18px;width:100%;max-width:340px;text-align:center;box-shadow:0 6px 0 rgba(27,39,56,.18);display:flex;flex-direction:column;gap:11px;margin:auto}
.card h1{font-family:var(--display);font-weight:400;font-size:44px;line-height:1;margin:0;color:var(--blue);text-shadow:0 3px 0 var(--blue-dk);animation:bob 1.6s ease-in-out infinite}
.card h2{font-family:var(--display);font-weight:400;font-size:34px;margin:0}
.card p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
@keyframes bob{50%{transform:translateY(-4px) rotate(-1.5deg)}}
@media (prefers-reduced-motion:reduce){.card h1{animation:none}}
.stats{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.stats .chip{box-shadow:none;background:var(--soft)}
.picker{background:var(--soft);border-radius:16px;padding:10px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:6px}
.picker canvas{width:100%;max-width:120px;height:110px;margin:0 auto;display:block}
.picker .nm{font-family:var(--display);font-size:20px}
.arrow{padding:8px 0;font-size:22px;border-radius:12px}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:12px 16px;font-family:var(--display);font-size:20px;letter-spacing:.03em;color:#fff;background:var(--blue);box-shadow:0 4px 0 var(--blue-dk);transition:transform .08s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--blue-dk)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button.gold{background:var(--gold);color:var(--ink);box-shadow:0 4px 0 #c58a00}
button.ghost{background:var(--soft);color:var(--ink);box-shadow:0 4px 0 #c9d6e6;font-size:16px}
button:disabled{opacity:.5;cursor:default}
.small{font-size:12px;color:var(--muted)}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
</style>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
try{const tw=window.Telegram&&Telegram.WebApp;if(tw){tw.ready();tw.expand();tw.disableVerticalSwipes&&tw.disableVerticalSwipes();tw.setHeaderColor&&tw.setHeaderColor('#8fd3f4');}}catch(e){}
</script>

<body>


<div id="app">
  <canvas id="cv" aria-label="O'yin maydoni"></canvas>
  <div class="hud">
    <span class="chip">Level <b id="hLevel">1</b></span>
    <span class="chip">❤ <b id="hLives">5</b></span>
    <span class="chip">🪙 <b id="hCoins">0</b></span>
    <button id="btnSound" aria-label="Ovozni yoqish yoki o'chirish">🔊</button>
  </div>

  <div class="overlay" id="menu">
    <div class="card">
      <h1>To'da Jangi</h1>
      <p>Bosib turing va suring. Askarlaringizni yashil darvozalardan o'tkazib ko'paytiring, Qora Kapitan qal'asini yiqiting!</p>
      <div class="stats">
        <span class="chip">Level <b id="mLevel">1</b></span>
        <span class="chip">🪙 <b id="mCoins">0</b></span>
      </div>
      <div class="picker">
        <button class="ghost arrow" id="prevSkin" aria-label="Oldingi qahramon">‹</button>
        <div><canvas id="pv" width="240" height="220"></canvas><div class="nm" id="skinName">Askar</div></div>
        <button class="ghost arrow" id="nextSkin" aria-label="Keyingi qahramon">›</button>
      </div>
      <button class="gold" id="btnSkin">Tanlangan</button>
      <button id="btnPlay">O'ynash</button>
      <button class="ghost" id="btnUpgrade">Otish tezligi +1 (🪙 <span id="upCost">50</span>)</button>
      <span class="small">Tezlik darajasi: <span id="rateLv">1</span></span>
    </div>
  </div>

  <div class="overlay" id="end" hidden>
    <div class="card">
      <h2 id="endTitle">G'alaba!</h2>
      <p id="endText">Qal'a yiqildi.</p>
      <div class="stats"><span class="chip">🪙 +<b id="endCoins">0</b></span></div>
      <button class="gold" id="btnDouble">x2 tanga — reklama ko'rish</button>
      <span class="small">Haqiqiy o'yinda bu yerda mukofotli reklama chiqadi (demo).</span>
      <button id="btnNext">Keyingi level</button>
      <button class="ghost" id="btnMenu">Menyu</button>
    </div>
  </div>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const cv=$('cv'), ctx=cv.getContext('2d');
let W=360,H=640;
function resize(){
  const r=cv.getBoundingClientRect(), d=Math.min(window.devicePixelRatio||1,2);
  W=r.width||360;H=r.height||640;cv.width=Math.round(W*d);cv.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);
}
addEventListener('resize',resize);resize();

// ---------- characters ----------
const SKIN='#f5c9a0';
const SKINS=[
  {id:'askar',name:'Askar',price:0,body:'#2369e8',dk:'#1446a8'},
  {id:'qaroqchi',name:'Qaroqchi',price:120,body:'#0f9d8a',dk:'#0a6b5e'},
  {id:'ninja',name:'Ninja',price:250,body:'#3a3f55',dk:'#1f2233'},
  {id:'viking',name:'Viking',price:400,body:'#c06a1c',dk:'#87470f'},
  {id:'robot',name:'Robot',price:600,body:'#7a8798',dk:'#4f5a69'},
];
const BOSS={id:'boss',body:'#ea4b4f',dk:'#a92a2e'};

// Draws a character head centred at (x,y) with radius s. dead=true -> X eyes.
function head(c,id,x,y,s,dead,angry){
  c.save();c.translate(x,y);
  if(id==='robot'){
    c.fillStyle='#aab6c4';c.fillRect(-s,-s,s*2,s*2);
    c.fillStyle='#7a8798';c.fillRect(-s*.12,-s*1.5,s*.24,s*.55);
    c.fillStyle='#ff5a5f';c.beginPath();c.arc(0,-s*1.55,s*.2,0,7);c.fill();
  }else{
    c.fillStyle=id==='ninja'?'#262a3b':SKIN;c.beginPath();c.arc(0,0,s,0,7);c.fill();
  }
  // eyes
  const ex=s*.38, ey=-s*.05, er=Math.max(1,s*.16);
  if(id==='ninja'){c.fillStyle=SKIN;c.fillRect(-s*.8,-s*.32,s*1.6,s*.48);}
  const eye=(dx,patch)=>{
    if(patch){c.fillStyle='#111';c.beginPath();c.arc(dx,ey,er*1.5,0,7);c.fill();c.strokeStyle='#111';c.lineWidth=Math.max(1,s*.1);c.beginPath();c.moveTo(-s,-s*.55);c.lineTo(s,s*.15);c.stroke();return;}
    if(dead){c.strokeStyle='#111';c.lineWidth=Math.max(1,s*.14);c.beginPath();c.moveTo(dx-er,ey-er);c.lineTo(dx+er,ey+er);c.moveTo(dx+er,ey-er);c.lineTo(dx-er,ey+er);c.stroke();return;}
    c.fillStyle=id==='robot'?'#3ff0ff':'#111';c.beginPath();c.arc(dx,ey,er,0,7);c.fill();
  };
  eye(-ex,false);eye(ex,id==='qaroqchi'&&!dead);
  if(angry&&!dead){c.strokeStyle='#111';c.lineWidth=Math.max(1,s*.12);c.beginPath();c.moveTo(-ex-er*1.5,ey-er*2.6);c.lineTo(-ex+er*1.5,ey-er*1.4);c.moveTo(ex+er*1.5,ey-er*2.6);c.lineTo(ex-er*1.5,ey-er*1.4);c.stroke();}
  // mouth
  if(s>6&&id!=='ninja'&&id!=='robot'){c.strokeStyle='#5a2a1a';c.lineWidth=Math.max(1,s*.09);c.beginPath();
    if(dead){c.arc(0,s*.5,s*.22,Math.PI*1.1,Math.PI*1.9);}else if(angry){c.moveTo(-s*.25,s*.45);c.lineTo(s*.25,s*.38);}else{c.arc(0,s*.28,s*.25,.2,Math.PI-.2);}
    c.stroke();}
  if(id==='robot'&&s>6){c.fillStyle='#4f5a69';c.fillRect(-s*.45,s*.42,s*.9,s*.18);}
  // hats
  if(id==='askar'){c.fillStyle='#3d7a3a';c.beginPath();c.arc(0,-s*.25,s*1.05,Math.PI,0);c.fill();c.fillRect(-s*1.2,-s*.32,s*2.4,s*.2);}
  if(id==='qaroqchi'){c.fillStyle='#d62e3a';c.beginPath();c.arc(0,-s*.3,s*1.02,Math.PI,0);c.fill();c.fillStyle='#fff';for(let i=-1;i<=1;i++){c.beginPath();c.arc(i*s*.45,-s*.75,s*.1,0,7);c.fill();}
    c.fillStyle='#d62e3a';c.beginPath();c.moveTo(s*.9,-s*.4);c.lineTo(s*1.5,-s*.1);c.lineTo(s*1.3,-s*.6);c.fill();}
  if(id==='ninja'){c.fillStyle='#d62e3a';c.fillRect(-s,-s*.55,s*2,s*.18);c.fillRect(s*.8,-s*.55,s*.6,s*.12);c.fillRect(s*.8,-s*.4,s*.5,s*.12);}
  if(id==='viking'){
    c.fillStyle='#e07b1a';c.beginPath();c.arc(0,s*.55,s*.75,0,Math.PI);c.fill();
    c.fillStyle='#9aa5b1';c.beginPath();c.arc(0,-s*.2,s*1.05,Math.PI,0);c.fill();
    c.fillStyle='#fff3dc';c.beginPath();c.moveTo(-s*.9,-s*.4);c.quadraticCurveTo(-s*1.7,-s*.9,-s*1.4,-s*1.7);c.lineTo(-s*.6,-s*.8);c.fill();
    c.beginPath();c.moveTo(s*.9,-s*.4);c.quadraticCurveTo(s*1.7,-s*.9,s*1.4,-s*1.7);c.lineTo(s*.6,-s*.8);c.fill();}
  if(id==='boss'){
    c.fillStyle='#4a2a14';c.beginPath();c.arc(0,s*.55,s*.8,0,Math.PI);c.fill();
    c.fillStyle='#1b1b24';c.beginPath();c.moveTo(-s*1.6,-s*.35);c.quadraticCurveTo(0,-s*.1,s*1.6,-s*.35);c.lineTo(s*.9,-s*1.5);c.quadraticCurveTo(0,-s*1.1,-s*.9,-s*1.5);c.closePath();c.fill();
    c.fillStyle='#fff';c.beginPath();c.arc(0,-s*.85,s*.2,0,7);c.fill();c.fillStyle='#1b1b24';c.fillRect(-s*.1,-s*.9,s*.07,s*.07);c.fillRect(s*.03,-s*.9,s*.07,s*.07);}
  c.restore();
}

// ---------- save ----------
let save={level:1,coins:0,rate:1,skin:'askar',owned:['askar'],sound:true};
try{const s=JSON.parse(localStorage.getItem('todaJangi2')||'null');if(s)save=Object.assign(save,s);}catch(e){}
function persist(){try{localStorage.setItem('todaJangi2',JSON.stringify(save));}catch(e){}}
const upCost=()=>50*save.rate;
const mySkin=()=>SKINS.find(s=>s.id===save.skin)||SKINS[0];

// ---------- sound (soft synth: sine/triangle, gentle attack, low-pass, compressor) ----------
let ac=null,master=null,lastShot=0,lastPop=0;
function audio(){
  if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();
    const comp=ac.createDynamicsCompressor();comp.threshold.value=-20;comp.ratio.value=4;
    const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3200;
    master=ac.createGain();master.gain.value=.55;master.connect(lp).connect(comp).connect(ac.destination);}
  if(ac.state==='suspended')ac.resume();
  return ac;
}
// note(freq, duration, volume, pitch slide in Hz, wave, delay)
function note(f,d,vol=.12,slide=0,type='sine',delay=0){
  if(!save.sound)return;
  try{const c=audio(),t=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(master);o.start(t);o.stop(t+d+.02);}catch(e){}
}
function bell(f,vol=.1,delay=0){note(f,.5,vol,0,'sine',delay);note(f*2,.3,vol*.35,0,'sine',delay);note(f*3.01,.18,vol*.12,0,'sine',delay);}
function tone(f,d){bell(f,.08);} // legacy calls
const PENTA=[523.25,587.33,659.25,783.99,880,1046.5];
const sfx={
  shot(){const n=performance.now();if(n-lastShot<110)return;lastShot=n;note(700+Math.random()*80,.07,.05,-350,'sine');},
  gate(v){const i=Math.min(PENTA.length-1,Math.max(0,v-2));bell(PENTA[i],.1);bell(PENTA[i]*1.5,.05,.07);},
  hit(){note(150,.14,.14,-70,'sine');},
  pop(){const n=performance.now();if(n-lastPop<70)return;lastPop=n;note(420+Math.random()*120,.16,.07,260,'triangle');},
  win(){[523.25,659.25,783.99,1046.5].forEach((f,i)=>bell(f,.11,i*.12));bell(1318.5,.08,.5);},
  lose(){[392,349.2,293.7].forEach((f,i)=>note(f,.45,.1,-20,'triangle',i*.22));},
  combo(){[783.99,1046.5].forEach((f,i)=>bell(f,.09,i*.08));},
};
function soundBtn(){$('btnSound').textContent=save.sound?'🔊':'🔇';}
$('btnSound').onclick=()=>{save.sound=!save.sound;persist();soundBtn();};
soundBtn();

// ---------- game ----------
let G=null, running=false, last=0;
const MAX_UNITS=360, MAX_DEAD=160;
const trackL=()=>W*0.07, trackR=()=>W*0.93;
const R=()=>Math.max(5,W*0.014);
function newGame(){
  const L=save.level, gw=W*0.27;
  const pool=[['x',2],['x',3],['+',8],['x',2],['+',15],['x',4]];
  const rows=L<3?[0.62,0.44]:[0.66,0.51,0.37];
  G={units:[],enemies:[],dead:[],parts:[],texts:[],
     gates:rows.map((fy,i)=>{const p=pool[(L+i*2)%pool.length];return{id:i,y:H*fy,w:gw,h:H*0.036,x:trackL()+Math.random()*(trackR()-trackL()-gw),dir:Math.random()<.5?-1:1,speed:W*(0.12+0.03*Math.min(L,8))*(i%2?1.2:1),op:p[0],val:p[1],flash:0};}),
     baseMax:40+L*28, baseHp:40+L*28, lives:5, cx:W/2, fireT:0, spawnT:1.4, firing:false, t:0,
     earned:0, over:false, shake:0, bossHit:0, best:0, banner:2.2};
}

// input
function setX(clientX){const b=cv.getBoundingClientRect();G.cx=Math.max(trackL()+R()*3,Math.min(trackR()-R()*3,clientX-b.left));}
cv.addEventListener('pointerdown',e=>{if(!running)return;cv.setPointerCapture(e.pointerId);G.firing=true;setX(e.clientX);});
cv.addEventListener('pointermove',e=>{if(running&&G.firing)setX(e.clientX);});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>{if(G)G.firing=false;}));
const keys={};
addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' '&&G&&running)G.firing=true;});
addEventListener('keyup',e=>{keys[e.key]=false;if(e.key===' '&&G)G.firing=false;});

function die(o,team){
  // spinning head + dizzy stars
  if(G.dead.length<MAX_DEAD)G.dead.push({x:o.x,y:o.y,rot:0,vr:(Math.random()<.5?-1:1)*(10+Math.random()*8),vy:-H*0.12,vx:(Math.random()-.5)*W*.15,life:.7,team});
}
function say(x,y,txt,c,size=1){G.texts.push({x,y,txt,c,life:1,size});}
function burst(x,y,c,n){for(let i=0;i<n;i++)G.parts.push({x,y,vx:(Math.random()-.5)*W*.5,vy:(Math.random()-.5)*W*.5,life:.4,c});}

function update(dt){
  const r=R(), cannonY=H*0.88, baseY=H*0.11, baseH=H*0.075, baseW=W*0.38, bx=W/2;
  G.t+=dt;G.banner=Math.max(0,G.banner-dt);G.shake=Math.max(0,G.shake-dt*3);G.bossHit=Math.max(0,G.bossHit-dt);
  if(keys.ArrowLeft)G.cx=Math.max(trackL()+r*3,G.cx-W*0.6*dt);
  if(keys.ArrowRight)G.cx=Math.min(trackR()-r*3,G.cx+W*0.6*dt);

  for(const g of G.gates){g.x+=g.dir*g.speed*dt;if(g.x<trackL()){g.x=trackL();g.dir=1}if(g.x+g.w>trackR()){g.x=trackR()-g.w;g.dir=-1}g.flash=Math.max(0,g.flash-dt);}

  G.fireT-=dt;
  if(G.firing&&G.fireT<=0&&G.units.length<MAX_UNITS){
    G.fireT=0.17/(1+0.18*(save.rate-1));
    G.units.push({x:G.cx+(Math.random()-.5)*r,y:cannonY-r*4,py:cannonY,vx:0,g:[],dead:false,ph:Math.random()*6});
    sfx.shot();
  }
  G.spawnT-=dt;
  if(G.spawnT<=0){
    const L=save.level;G.spawnT=Math.max(0.4,1.5-L*0.09);
    for(let i=0,n=1+Math.floor(L/2);i<n;i++)G.enemies.push({x:bx+(Math.random()-.5)*baseW*.8,y:baseY+baseH+r*2,vx:(Math.random()-.5)*W*.06,dead:false,ph:Math.random()*6});
  }

  const vy=H*0.42, evy=H*0.13, born=[];
  for(const u of G.units){
    u.py=u.y;u.y-=vy*dt;u.ph+=dt*14;
    if(u.y<H*0.32){u.vx+=(bx-u.x)*2.2*dt;u.vx*=0.96}
    u.x+=u.vx*dt;
    for(const g of G.gates){
      if(u.py>=g.y&&u.y<g.y&&u.x>g.x&&u.x<g.x+g.w&&!u.g.includes(g.id)){
        u.g.push(g.id);
        const extra=g.op==='x'?g.val-1:g.val;
        for(let k=0;k<extra&&G.units.length+born.length<MAX_UNITS;k++)
          born.push({x:Math.max(g.x+r,Math.min(g.x+g.w-r,u.x+(Math.random()-.5)*r*6)),y:u.y+Math.random()*r*4,py:u.y,vx:(Math.random()-.5)*W*.08,g:u.g.slice(),dead:false,ph:Math.random()*6});
        if(g.flash<=0){sfx.gate(g.val);say(g.x+g.w/2,g.y-g.h*1.4,(g.op==='x'?'x':'+')+g.val,'#14834a');}
        g.flash=0.12;
      }
    }
    if(u.y<baseY+baseH&&Math.abs(u.x-bx)<baseW/2){u.dead=true;G.baseHp--;G.bossHit=.15;G.shake=Math.min(1,G.shake+.08);burst(u.x,baseY+baseH,'#ffd166',2);if(Math.random()<.3)sfx.hit();}
    else if(u.y<-20)u.dead=true;
  }
  G.units.push(...born);

  const n=G.units.length;
  for(const [lim,txt] of [[300,'DAHSHAT!'],[150,'AJOYIB!'],[60,"ZO'R!"]]){if(n>=lim&&G.best<lim){G.best=lim;say(W/2,H*0.55,txt,'#ffb400',2.2);sfx.combo();break;}}

  for(const e of G.enemies){
    e.y+=evy*dt;e.x+=e.vx*dt;e.ph+=dt*10;
    if(e.x<trackL()+r||e.x>trackR()-r)e.vx*=-1;
    if(e.y>cannonY-r*2){e.dead=true;G.lives--;G.shake=1;die(e,'red');burst(e.x,cannonY,'#ea4b4f',8);say(G.cx,cannonY-r*8,'-1 ❤','#ea4b4f',1.3);sfx.hit();}
  }
  const d2=(r*2.2)**2;
  let pops=0;
  for(const e of G.enemies){if(e.dead)continue;
    for(const u of G.units){if(u.dead)continue;
      const dx=u.x-e.x,dy=u.y-e.y;
      if(dx*dx+dy*dy<d2){u.dead=e.dead=true;die(u,'blue');die(e,'red');pops++;break;}
    }}
  if(pops)sfx.pop();
  G.units=G.units.filter(u=>!u.dead);
  G.enemies=G.enemies.filter(e=>!e.dead);
  for(const d of G.dead){d.rot+=d.vr*dt;d.y+=d.vy*dt;d.x+=d.vx*dt;d.vy+=H*0.35*dt;d.life-=dt;}
  G.dead=G.dead.filter(d=>d.life>0);
  for(const p of G.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}
  G.parts=G.parts.filter(p=>p.life>0);
  for(const t of G.texts){t.y-=H*0.06*dt;t.life-=dt*1.1}
  G.texts=G.texts.filter(t=>t.life>0);

  if(G.baseHp<=0)finish(true);else if(G.lives<=0)finish(false);
}

function rr(x,y,w,h,rad){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,rad):ctx.rect(x,y,w,h);}
function unit(x,y,s,sk,ph){
  const bob=Math.sin(ph)*s*.15;
  ctx.fillStyle=sk.dk;ctx.beginPath();ctx.ellipse(x,y+s*.9,s*.8,s*.35,0,0,7);ctx.fill();
  ctx.fillStyle=sk.body;ctx.beginPath();ctx.arc(x,y+s*.35+bob,s*.75,0,7);ctx.fill();
  head(ctx,sk.id,x,y-s*.55+bob,s*.62,false,sk.id==='boss');
}
function draw(){
  const r=R(), tl=trackL(), tr=trackR();
  ctx.setTransform(ctx.getTransform().a,0,0,ctx.getTransform().d,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(G&&G.shake>0)ctx.translate((Math.random()-.5)*G.shake*8,(Math.random()-.5)*G.shake*8);
  ctx.fillStyle='#dcc58c';rr(tl-6,-10,tr-tl+12,H+20,14);ctx.fill();
  ctx.fillStyle='#f6e7bf';rr(tl,-10,tr-tl,H+20,10);ctx.fill();
  ctx.fillStyle='rgba(220,197,140,.45)';
  const off=(G?G.t*H*0.13:0)%(H*0.1);
  for(let y=-H*0.1+off;y<H;y+=H*0.1)ctx.fillRect(tl,y,tr-tl,H*0.012);
  if(!G){ctx.restore();return;}
  ctx.textAlign='center';ctx.textBaseline='middle';

  // fortress + boss
  const baseY=H*0.11, baseH=H*0.075, baseW=W*0.38, bx=W/2, bs=baseH*0.55;
  head(ctx,'boss',bx,baseY-bs*0.55+(G.bossHit?2:0),bs,G.over&&G.baseHp<=0,true);
  ctx.fillStyle='#a92a2e';rr(bx-baseW/2,baseY+6,baseW,baseH,10);ctx.fill();
  ctx.fillStyle=G.bossHit?'#ff8a8d':'#ea4b4f';rr(bx-baseW/2,baseY,baseW,baseH,10);ctx.fill();
  ctx.fillStyle='#fff';ctx.font=`${Math.round(baseH*0.5)}px 'Lilita One',Impact,sans-serif`;
  ctx.fillText(Math.max(0,G.baseHp),bx,baseY+baseH/2+1);
  const hb=Math.max(0,G.baseHp/G.baseMax);
  ctx.fillStyle='rgba(27,39,56,.25)';rr(bx-baseW/2,baseY+baseH+12,baseW,6,3);ctx.fill();
  ctx.fillStyle='#ea4b4f';rr(bx-baseW/2,baseY+baseH+12,baseW*hb,6,3);ctx.fill();

  for(const g of G.gates){
    ctx.fillStyle=g.flash?'rgba(255,255,255,.8)':'rgba(37,194,110,.55)';
    rr(g.x,g.y-g.h/2,g.w,g.h,6);ctx.fill();
    ctx.fillStyle='#14834a';ctx.fillRect(g.x-3,g.y-g.h*1.1,6,g.h*2.2);ctx.fillRect(g.x+g.w-3,g.y-g.h*1.1,6,g.h*2.2);
    ctx.fillStyle='#fff';ctx.font=`${Math.round(g.h*1.05)}px 'Lilita One',Impact,sans-serif`;
    ctx.fillText((g.op==='x'?'x':'+')+g.val,g.x+g.w/2,g.y+1);
  }

  const sk=mySkin(), big=G.units.length+G.enemies.length>220;
  for(const e of G.enemies)unit(e.x,e.y,r,BOSS,e.ph);
  if(big){ctx.fillStyle=sk.body;for(const u of G.units){ctx.beginPath();ctx.arc(u.x,u.y,r*.8,0,7);ctx.fill();}
    for(const u of G.units)head(ctx,sk.id,u.x,u.y-r*.7,r*.55,false,false);}
  else for(const u of G.units)unit(u.x,u.y,r,sk,u.ph);

  // dead: spinning X-eyed heads with dizzy stars
  for(const d of G.dead){
    ctx.save();ctx.globalAlpha=Math.min(1,d.life/.35);ctx.translate(d.x,d.y);ctx.rotate(d.rot);
    head(ctx,d.team==='red'?'boss':sk.id,0,0,r*.85,true,false);ctx.restore();
    if(G.dead.length<60){ctx.fillStyle='#ffd166';for(let i=0;i<3;i++){const a=d.rot*.6+i*2.1;ctx.beginPath();ctx.arc(d.x+Math.cos(a)*r*1.4,d.y-r*1.3+Math.sin(a)*r*.5,r*.22,0,7);ctx.fill();}}
  }
  ctx.globalAlpha=1;
  for(const p of G.parts){ctx.globalAlpha=Math.max(0,p.life/.4);ctx.fillStyle=p.c;ctx.fillRect(p.x-2,p.y-2,4,4);}
  ctx.globalAlpha=1;

  // cannon with the hero on top
  const cy=H*0.88, cw=Math.max(48,W*0.15);
  ctx.fillStyle='#4a3a2a';ctx.beginPath();ctx.arc(G.cx-cw*.32,cy+cw*.62,cw*.17,0,7);ctx.arc(G.cx+cw*.32,cy+cw*.62,cw*.17,0,7);ctx.fill();
  ctx.fillStyle=sk.dk;rr(G.cx-cw/2,cy+6,cw,cw*0.55,12);ctx.fill();
  ctx.fillStyle=sk.body;rr(G.cx-cw/2,cy,cw,cw*0.55,12);ctx.fill();
  ctx.fillStyle='#2b2b36';rr(G.cx-cw*.14,cy-cw*.38,cw*.28,cw*.45,5);ctx.fill();
  head(ctx,sk.id,G.cx-cw*.42,cy-cw*.05,cw*.3,G.over&&G.lives<=0,false);
  ctx.fillStyle='#fff';ctx.font=`${Math.round(cw*0.26)}px 'Lilita One',Impact,sans-serif`;
  ctx.fillText(G.units.length,G.cx+cw*.12,cy+cw*.3);

  for(const t of G.texts){
    ctx.globalAlpha=Math.min(1,t.life*2);const sz=Math.round(r*2.6*t.size*(1+(1-t.life)*.3));
    ctx.font=`${sz}px 'Lilita One',Impact,sans-serif`;ctx.lineWidth=Math.max(3,sz*.16);ctx.strokeStyle='#fff';ctx.strokeText(t.txt,t.x,t.y);ctx.fillStyle=t.c;ctx.fillText(t.txt,t.x,t.y);
  }
  ctx.globalAlpha=1;
  if(G.banner>0&&running){
    ctx.globalAlpha=Math.min(1,G.banner);ctx.fillStyle='rgba(27,39,56,.75)';rr(W*.12,H*.43,W*.76,H*.1,16);ctx.fill();
    ctx.fillStyle='#fff';ctx.font=`${Math.round(H*.038)}px 'Lilita One',Impact,sans-serif`;ctx.fillText('Level '+save.level,W/2,H*.465);
    ctx.font=`800 ${Math.round(H*.02)}px Nunito,sans-serif`;ctx.fillText('Bosib turing va suring',W/2,H*.505);ctx.globalAlpha=1;
  }
  ctx.restore();
}

function hud(){$('hLevel').textContent=save.level;$('hLives').textContent=G?Math.max(0,G.lives):5;$('hCoins').textContent=save.coins;}
function loop(ts){
  const dt=Math.min(0.033,(ts-last)/1000||0);last=ts;
  if(running)update(dt);
  else if(G){for(const d of G.dead){d.rot+=d.vr*dt;d.y+=d.vy*dt;d.vy+=H*.35*dt;d.life-=dt;}G.dead=G.dead.filter(d=>d.life>0);}
  if(running)hud();
  draw();requestAnimationFrame(loop);
}

// ---------- menus ----------
let lastWin=false,doubled=false,pick=Math.max(0,SKINS.findIndex(s=>s.id===save.skin));
function drawPreview(){
  const p=$('pv'),c=p.getContext('2d'),sk=SKINS[pick];
  c.clearRect(0,0,p.width,p.height);
  c.fillStyle=sk.dk;c.beginPath();c.ellipse(120,200,60,14,0,0,7);c.fill();
  c.fillStyle=sk.body;c.beginPath();c.arc(120,160,48,0,7);c.fill();
  head(c,sk.id,120,85,42,false,false);
  $('skinName').textContent=sk.name;
  const owned=save.owned.includes(sk.id),b=$('btnSkin');
  if(save.skin===sk.id){b.textContent='Tanlangan ✓';b.disabled=true;}
  else if(owned){b.textContent='Tanlash';b.disabled=false;}
  else{b.textContent=`Sotib olish (🪙 ${sk.price})`;b.disabled=save.coins<sk.price;}
}
$('prevSkin').onclick=()=>{pick=(pick+SKINS.length-1)%SKINS.length;drawPreview();};
$('nextSkin').onclick=()=>{pick=(pick+1)%SKINS.length;drawPreview();};
$('btnSkin').onclick=()=>{const sk=SKINS[pick];
  if(!save.owned.includes(sk.id)){if(save.coins<sk.price)return;save.coins-=sk.price;save.owned.push(sk.id);sfx.win();}
  save.skin=sk.id;persist();menu();};

function finish(win){
  if(G.over)return;G.over=true;running=false;G.firing=false;lastWin=win;doubled=false;
  G.earned=win?20+save.level*10+G.lives*5:Math.round((1-G.baseHp/G.baseMax)*(10+save.level*4));
  save.coins+=G.earned;if(win)save.level++;persist();
  win?sfx.win():sfx.lose();
  setTimeout(()=>{
    $('endTitle').textContent=win?"G'alaba!":"Mag'lubiyat";
    $('endText').textContent=win?"Qora Kapitanning boshi aylanib qoldi! Keyingi level qiyinroq.":"Qaroqchilar yetib keldi. Tezlikni oshirib qayta urinib ko'ring.";
    $('endCoins').textContent=G.earned;
    $('btnNext').textContent=win?'Keyingi level':'Qayta urinish';
    $('btnDouble').disabled=G.earned<=0;$('btnDouble').textContent="x2 tanga — reklama ko'rish";
    $('end').hidden=false;hud();
  },700);
}
function menu(){
  $('mLevel').textContent=save.level;$('mCoins').textContent=save.coins;
  $('upCost').textContent=upCost();$('rateLv').textContent=save.rate;
  $('btnUpgrade').disabled=save.coins<upCost();
  drawPreview();$('end').hidden=true;$('menu').hidden=false;hud();
}
function start(){resize();newGame();$('menu').hidden=true;$('end').hidden=true;running=true;hud();bell(659.25,.08);}
$('btnPlay').onclick=start;
$('btnNext').onclick=start;
$('btnMenu').onclick=menu;
$('btnUpgrade').onclick=()=>{if(save.coins>=upCost()){save.coins-=upCost();save.rate++;persist();menu();}};
$('btnDouble').onclick=()=>{
  if(doubled)return;doubled=true;const b=$('btnDouble');b.disabled=true;
  let s=3;b.textContent=`Reklama... ${s}`;
  const iv=setInterval(()=>{s--;if(s>0){b.textContent=`Reklama... ${s}`;return;}
    clearInterval(iv);save.coins+=G.earned;persist();$('endCoins').textContent=G.earned*2;b.textContent="Tanga ikki barobar bo'ldi";hud();sfx.win();},1000);
};
newGame();menu();requestAnimationFrame(loop);
})();
</script>
